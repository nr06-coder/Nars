<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login — NARS</title>

    <link rel="stylesheet" href="auth.css">

</head>

<body>

    <div class="auth-page">

        <a href="index.html" class="back-home">
            ← Back to NARS
        </a>


        <div class="auth-card">

            <div class="auth-logo">
                N
            </div>

            <h1>Welcome back</h1>

            <p class="auth-subtitle">
                Login to continue to NARS.
            </p>


            <form id="loginForm">

                <label>Email</label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required
                >


                <label>Password</label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >


                <button
                    type="submit"
                    class="auth-button"
                >
                    Login
                </button>

            </form>


            <p id="loginMessage" class="message"></p>


            <div class="switch">

                Don't have an account?

                <a href="signup.html">
                    Create Account
                </a>

            </div>

        </div>

    </div>


    <script src="auth.js"></script>

</body>

</html>
