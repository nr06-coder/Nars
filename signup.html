<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account — NARS</title>

    <link rel="stylesheet" href="auth.css">

</head>

<body>

    <div class="auth-page">

        <a href="index.html" class="back-home">
            ← Back to NARS
        </a>


        <div class="auth-card">

            <div class="auth-logo">
                N
            </div>

            <h1>Create account</h1>

            <p class="auth-subtitle">
                Join NARS and explore everything in one place.
            </p>


            <form id="signupForm">

                <label>Full Name</label>

                <input
                    type="text"
                    id="signupName"
                    placeholder="Enter your name"
                    required
                >


                <label>Email</label>

                <input
                    type="email"
                    id="signupEmail"
                    placeholder="Enter your email"
                    required
                >


                <label>Password</label>

                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Create a password"
                    required
                >


                <label>Confirm Password</label>

                <input
                    type="password"
                    id="signupConfirm"
                    placeholder="Confirm your password"
                    required
                >


                <button
                    type="submit"
                    class="auth-button"
                >
                    Create Account
                </button>

            </form>


            <p id="signupMessage" class="message"></p>


            <div class="switch">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </div>

        </div>

    </div>


    <script src="auth.js"></script>

</body>

</html>
